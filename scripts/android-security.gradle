// Emit the Maven packages actually selected by the standalone Android variant, including transitives.
import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.beforeProject { project ->
    if (project.path == ':app' && project.rootProject.name == 'TopicTrail') {
        project.tasks.register('topicTrailSecurityInventory') {
            doLast {
                def config = project.providers.gradleProperty('topicTrailAuditRuntime').getOrElse('releaseRuntimeClasspath')
                if (!(config in ['releaseRuntimeClasspath', 'migrationRuntimeClasspath', 'debugRuntimeClasspath'])) {
                    throw new GradleException('Unknown TopicTrail audit variant.')
                }
                def runtime = project.configurations.getByName(config)
                def components = runtime.incoming.resolutionResult.allComponents.collect { it.id }
                    .findAll { it instanceof ModuleComponentIdentifier }
                    .collect { id ->
                        def part = { String value -> java.net.URLEncoder.encode(value, 'UTF-8').replace('+', '%20') }
                        [type: 'library', group: id.group, name: id.module, version: id.version,
                         purl: "pkg:maven/${part(id.group)}/${part(id.module)}@${part(id.version)}"]
                    }.sort { it.purl }
                // allComponents alone can return a partial graph when resolution fails.
                def unresolved = runtime.incoming.resolutionResult.allDependencies.findAll {
                    it instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult
                }
                if (components.isEmpty() || !unresolved.isEmpty()) {
                    throw new GradleException('Cannot scan a partial Android runtime dependency graph.')
                }
                def destination = project.rootProject.layout.buildDirectory.file('security/android-runtime.cdx.json').get().asFile
                destination.parentFile.mkdirs()
                destination.text = JsonOutput.toJson([bomFormat: 'CycloneDX', specVersion: '1.5', version: 1, components: components])
                logger.lifecycle("Wrote ${components.size()} Android runtime components to ${destination.name}")
            }
        }
    }
}
